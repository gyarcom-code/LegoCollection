<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lego Collection — каталог</title>
  <meta name="description" content="Lego Collection">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='4' y='18' width='56' height='40' rx='6' fill='%23ffd400'/><rect x='12' y='8' width='14' height='12' rx='3' fill='%23ffd400'/><rect x='38' y='8' width='14' height='12' rx='3' fill='%23ffd400'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=202611131541">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/" data-i18n-aria="home">
        <span class="brand__brick" aria-hidden="true"><i></i><i></i></span>
        <span class="brand__text">Lego<b>Collection</b></span>
      </a>
      <form class="search" role="search" onsubmit="return false">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
        <input id="search" type="search" data-i18n-placeholder="searchPh" data-i18n-aria="searchPh" autocomplete="off">
      </form>
      <button class="tree-toggle" id="treeToggle" type="button" aria-controls="sidebar" aria-expanded="false" data-i18n="categories">Категорії</button>
      <label class="lang" data-i18n-title="lang">
        <select id="lang" data-i18n-aria="lang">
          <option value="ua">UA</option>
          <option value="en">EN</option>
          <option value="ru">RU</option>
        </select>
      </label>
    </div>
  </header>

  <div class="layout">
    <main class="content" id="content">
      <div class="state" id="state">
        <div class="loader" aria-hidden="true"><span></span><span></span><span></span></div>
        <p data-i18n="loading">Завантажую колекцію з таблиці…</p>
      </div>
    </main>

    <aside class="sidebar" id="sidebar" data-i18n-aria="categories">
      <section class="panel panel--cats">
        <div class="panel__head">
          <button class="block-toggle" id="catsToggle" type="button" aria-expanded="true" aria-controls="tree">
            <h2 data-i18n="categories">Категорії</h2>
            <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4z"/></svg>
          </button>
          <button class="sidebar__close" id="treeClose" type="button" data-i18n-aria="close">×</button>
        </div>
        <nav id="tree" class="tree"></nav>
      </section>
      <section id="years" class="panel years"></section>
      <div class="sync" id="sync"></div>
    </aside>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>

  <button class="to-top" id="toTop" type="button" data-i18n-aria="toTop" data-i18n-title="toTop">
    <svg viewBox="0 0 56 52" aria-hidden="true">
      <defs>
        <linearGradient id="toTopGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0.82" stop-color="#dd1a22"/><stop offset="0.82" stop-color="#b3141b"/>
        </linearGradient>
      </defs>
      <rect x="10" y="2" width="14" height="10" rx="2.5" fill="#dd1a22"/>
      <rect x="32" y="2" width="14" height="10" rx="2.5" fill="#dd1a22"/>
      <rect x="10" y="2" width="14" height="3" rx="1.5" fill="#ff5a5f" opacity=".55"/>
      <rect x="32" y="2" width="14" height="3" rx="1.5" fill="#ff5a5f" opacity=".55"/>
      <rect x="2" y="9" width="52" height="41" rx="6" fill="url(#toTopGrad)"/>
      <path d="M28 16l11 11h-7v10h-8V27h-7z" fill="#fff"/>
    </svg>
  </button>

  <footer class="footer" data-i18n="footer"></footer>

  <script src="app.js?v=202611131541"></script>
</body>
</html>
